# Linux one-command setup:  PROJECTS_DIR=~/code docker compose up -d
# then open http://localhost:7777 and add projects as /projects/<folder-name>
services:
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama-models:/root/.ollama
    # NVIDIA GPU: install nvidia-container-toolkit and uncomment
    # deploy:
    #   resources:
    #     reservations:
    #       devices: [{ driver: nvidia, count: all, capabilities: [gpu] }]

  ollama-pull:
    image: ollama/ollama:latest
    depends_on: [ollama]
    environment:
      OLLAMA_HOST: ollama:11434
    entrypoint: ["sh", "-c", "sleep 3 && ollama pull qwen3:4b && ollama pull embeddinggemma"]
    restart: "no"

  ctx:
    build: .
    depends_on: [ollama]
    ports:
      - "127.0.0.1:7777:7777"   # only reachable from this machine
    volumes:
      - ${PROJECTS_DIR:-.}:/projects
      - ctx-data:/data

volumes:
  ollama-models:
  ctx-data:
