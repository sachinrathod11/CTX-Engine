[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ctx-engine"
version = "0.1.0"
description = "Local project context engine: turns a vague question into a project-aware prompt for any chatbot"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Gajji Sai Pavan Kumar" }]
dependencies = [
    "numpy>=1.24",
    "pathspec>=0.11",
    "watchdog>=3.0",
    "fastapi>=0.100",
    "uvicorn>=0.23",
    "typer>=0.9",
    "rich>=13",
    "pyperclip>=1.8",
]

[project.optional-dependencies]
tokens = ["tiktoken>=0.5"]
dev = ["pytest>=7", "httpx>=0.24"]

[project.scripts]
ctx = "ctx.cli:app"

[tool.setuptools.packages.find]
include = ["ctx*"]

[tool.setuptools.package-data]
ctx = ["web/*", "prompt/template.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
